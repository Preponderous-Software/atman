name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Links and citations resolve
        run: python tools/check_docs.py

      - name: Codex entries are cited and their plates are current
        run: python tools/plates/make_plates.py --check

      - name: Plate check catches a stale plate and an undefined citation
        run: |
          sed -i 's/"cites": \["P1"\]/"cites": ["P1", "P999"]/' content/codex/2-clay-and-pots.json
          if python tools/plates/make_plates.py --check > out.txt; then
            cat out.txt; echo "plate check passed a changed entry"; exit 1
          fi
          cat out.txt
          grep -q '\[P999\] is not defined' out.txt
          grep -q 'clay-and-pots.png: out of date' out.txt
          git checkout content/codex/2-clay-and-pots.json
          rm out.txt

      - name: Checker catches a broken citation and a broken link
        run: |
          printf 'See [P999] and [missing](NOPE.md) and [bad anchor](README.md#no-such-heading).\n' > broken.md
          if python tools/check_docs.py > out.txt; then
            cat out.txt; echo "checker passed a broken doc"; exit 1
          fi
          cat out.txt
          grep -q '\[P999\] is not defined' out.txt
          grep -q 'NOPE.md points at a missing file' out.txt
          grep -q 'no-such-heading has no matching heading' out.txt
          rm broken.md out.txt

  sim:
    name: Rules and tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the simulation and tests (no engine)
        run: |
          cmake -S . -B build -DATMAN_WITH_STRATA=OFF -DATMAN_WARNINGS_AS_ERRORS=ON
          cmake --build build -j4
      - name: Tests
        run: ctest --test-dir build --output-on-failure

  game-linux:
    name: Game (Linux, headless tour)
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/50_mesa.json
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3 build dependencies and Mesa
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev \
            libegl-dev libgl-dev libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Build the game on Strata
        run: |
          cmake -S . -B build -DATMAN_WARNINGS_AS_ERRORS=ON -DATMAN_BUILD_TESTS=OFF
          cmake --build build -j4 --target atman
      - name: Headless tour
        run: |
          mkdir -p tour
          ./build/atman --headless --tour --frames tour --width 960 --height 540
          test "$(ls tour/*.png | wc -l)" -eq 26
      - name: Autopilot playthrough (pinned fingerprint)
        run: |
          mkdir -p autopilot
          ./build/atman --headless --autopilot --frames autopilot --width 960 --height 540
      - uses: actions/upload-artifact@v4
        with:
          name: tour-linux
          path: |
            tour/
            autopilot/

  game-windows:
    name: Game (Windows, MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DATMAN_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
